name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

# Let one deploy finish before starting another
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # Stops GitHub Pages from ignoring the _next folder
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # Fallback publish for repos whose Pages "Source" is set to
      # "Deploy from a branch" instead of "GitHub Actions" — in that mode
      # the actions/deploy-pages step below reports success but the live
      # site never actually changes, since branch-based Pages ignores the
      # Actions artifact and only serves what's physically on this branch.
      - name: Publish to gh-pages branch (fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          publish_branch: gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4